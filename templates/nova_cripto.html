<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Criptomoeda - Carteira de Investimentos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; border: none; color: white; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .back { text-align: center; margin-top: 15px; }
        .back a { color: #007bff; text-decoration: none; font-size: 14px; }
        .back a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Adicionar Ativo</h2>
        <form action="/cripto/nova" method="POST">
            <div class="form-group">
                <label for="nome">Nome (ex: Bitcoin)</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="simbolo">Símbolo (ex: BTC)</label>
                <input type="text" id="simbolo" name="simbolo" required>
            </div>
            <div class="form-group">
                <label for="quantidade">Quantidade</label>
                <input type="number" step="any" id="quantidade" name="quantidade" required>
            </div>
            <div class="form-group">
                <label for="preco_medio">Preço Médio (R$)</label>
                <input type="number" step="any" id="preco_medio" name="preco_medio" required>
            </div>
            <button type="submit">Salvar Ativo</button>
        </form>
        <div class="back">
            <a href="/">Voltar para a Carteira</a>
        </div>
    </div>
</body>
</html>
