[package]
name = "carteira-investimentos"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "postgres", "macros", "rust_decimal" ] }
askama = "0.12"
serde = { version = "1.0", features = ["derive"] }
tower-http = { version = "0.5", features = ["fs"] }
dotenvy = "0.15"
rust_decimal = "1.35"
bcrypt = "0.15"
jsonwebtoken = "9.2"
chrono = "0.4"